name: Release
on:
  # workflow_call:
  #   inputs:
  #     version:
  #       description: The semantic version of the new release.
  #       required: true
  #       type: string
  workflow_dispatch: # Allows running this workflow for this repo
   inputs:
     version:
       description: The semantic version of the new release.
       required: true
       type: string
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate the new version
        run: |
          version=$(sed 's/^v//' <<<"${{inputs.version}}")
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]$ ]]
          echo "version=${version}" >> ${GITHUB_ENV}
      - name: Clone the repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-tags: true
      - name: Check for an existing milestone
        run: >
          VERSION_MILESTONE=$(gh repo view
          --json milestones
          --jq '.milestones[] | if .title | contains("${{inputs.version}}") then .number else 0 end');
          echo "VERSION_MILESTONE=${VERSION_MILESTONE}" >> ${GITHUB_ENV}
